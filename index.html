<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&edu Studio — Visual Educational IDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <style>
      * { box-sizing: border-box; }
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: #121212;
        color: #f8f8f2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #141414;
      }
      ::-webkit-scrollbar-thumb {
        background: #282828;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #e5b85c;
      }
      /* KaTeX Math on Monokai Black Theme */
      .katex {
        font-size: 1.05em;
        color: #f8f8f2;
      }
      .katex-display {
        overflow-x: auto;
        overflow-y: hidden;
        padding: 10px 14px;
        margin: 14px 0;
        background: rgba(22, 22, 22, 0.95);
        border: 1px solid #333333;
        border-radius: 6px;
        scrollbar-width: thin;
      }
      .katex-display > .katex {
        text-align: center;
        display: block;
      }
      .katex .mathnormal {
        color: #e5b85c; /* Luminous Pine Gold */
      }
      .katex .mord {
        color: #f0fdf4; /* Crisp pine frost white */
      }
      .katex .mbin, .katex .mrel {
        color: #23a55a; /* True lush forest green */
      }
      .katex .mopen, .katex .mclose {
        color: #e5b85c; /* Gold delimiters */
      }
      .katex .minner {
        color: #4ea8de; /* Alpine lake blue */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
